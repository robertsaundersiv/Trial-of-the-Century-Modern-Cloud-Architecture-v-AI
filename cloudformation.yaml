AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ObjectionInspection legal document summarizer. A plaintext document uploaded
  to the input bucket triggers a Lambda function that summarizes it with an
  Amazon Bedrock foundation model and writes the summary to the output bucket.

Parameters:
  ProjectName:
    Type: String
    Default: objection-inspection
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$"
    Description: Lowercase prefix for every resource name (bucket names must be lowercase).
  ModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock foundation model ID used for summaries (on-demand, us-east-1).
  MaxInputChars:
    Type: Number
    Default: 50000
    MinValue: 1000
    Description: Characters of each document sent to the model; longer documents are truncated.
  MaxOutputTokens:
    Type: Number
    Default: 1024
    MinValue: 100
    MaxValue: 5000
    Description: Upper limit on tokens the model may generate per summary.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: Days to keep the function's CloudWatch logs.

Resources:
  # ---------- Storage ----------
  # The input bucket's name is built from parameters instead of !Ref so the
  # Lambda permission and IAM policy can point at it without a circular
  # dependency (bucket -> notification -> function -> role -> bucket).
  InputBucket:
    Type: AWS::S3::Bucket
    DependsOn: SummarizeFunctionS3Permission
    Properties:
      BucketName: !Sub "${ProjectName}-input-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .txt
            Function: !GetAtt SummarizeFunction.Arn

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-output-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # Reject any request that is not sent over TLS.
  InputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InputBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt InputBucket.Arn
              - !Sub "${InputBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OutputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OutputBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt OutputBucket.Arn
              - !Sub "${OutputBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- Permissions ----------
  # Least privilege: read objects from the input bucket, write summaries to
  # the output bucket's summaries/ prefix, invoke one Bedrock model, and write
  # to the function's own log group. Nothing can list, delete, or reach other
  # buckets or models.
  SummarizeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-summarize-role"
      Description: Execution role for the legal document summarizer Lambda function.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: summarize-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadInputDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-input-${AWS::AccountId}-${AWS::Region}/*"
              - Sid: WriteSummaries
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${OutputBucket.Arn}/summaries/*"
              - Sid: InvokeSummaryModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${SummarizeFunctionLogGroup.Arn}:*"

  SummarizeFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SummarizeFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-input-${AWS::AccountId}-${AWS::Region}"
      SourceAccount: !Ref AWS::AccountId

  # ---------- Compute ----------
  SummarizeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-summarize"
      RetentionInDays: !Ref LogRetentionDays

  SummarizeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-summarize"
      Description: Summarizes legal documents from the input bucket with Amazon Bedrock.
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.lambda_handler
      Role: !GetAtt SummarizeFunctionRole.Arn
      MemorySize: 256
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref SummarizeFunctionLogGroup
      Environment:
        Variables:
          OUTPUT_BUCKET: !Ref OutputBucket
          MODEL_ID: !Ref ModelId
          MAX_INPUT_CHARS: !Ref MaxInputChars
          MAX_OUTPUT_TOKENS: !Ref MaxOutputTokens
      # Same code as src/summarize_function/lambda_function.py
      # (tests/test_template.py fails if the two drift apart).
      Code:
        ZipFile: |
          """Summarize a legal document uploaded to the input bucket with Amazon Bedrock."""
          import os
          import urllib.parse

          import boto3

          s3 = boto3.client("s3")
          bedrock = boto3.client("bedrock-runtime")

          OUTPUT_BUCKET = os.environ["OUTPUT_BUCKET"]
          MODEL_ID = os.environ.get("MODEL_ID", "amazon.nova-lite-v1:0")
          MAX_INPUT_CHARS = int(os.environ.get("MAX_INPUT_CHARS", "50000"))
          MAX_OUTPUT_TOKENS = int(os.environ.get("MAX_OUTPUT_TOKENS", "1024"))

          SYSTEM_PROMPT = (
              "You are a paralegal at ObjectionInspection. Summarize the legal document "
              "for a busy attorney in plain English, under 400 words, using these headings: "
              "Document Type and Purpose; Parties; Key Terms and Obligations; Important "
              "Dates and Deadlines; Termination and Remedies; Risks or Unusual Clauses. "
              "Use only facts in the document. If a section does not apply, write 'None stated.'"
          )


          def summarize(text):
              response = bedrock.converse(
                  modelId=MODEL_ID,
                  system=[{"text": SYSTEM_PROMPT}],
                  messages=[{
                      "role": "user",
                      "content": [{"text": f"<document>\n{text}\n</document>\n\nSummarize this document."}],
                  }],
                  inferenceConfig={"maxTokens": MAX_OUTPUT_TOKENS, "temperature": 0.2},
              )
              summary = response["output"]["message"]["content"][0]["text"]
              return summary, response["usage"]


          def lambda_handler(event, context):
              results = []
              for record in event["Records"]:
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])

                  body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
                  text = body.decode("utf-8", errors="replace")
                  truncated = len(text) > MAX_INPUT_CHARS
                  summary, usage = summarize(text[:MAX_INPUT_CHARS])

                  output_key = "summaries/" + key.rsplit(".", 1)[0] + "-summary.txt"
                  s3.put_object(
                      Bucket=OUTPUT_BUCKET,
                      Key=output_key,
                      Body=summary.encode("utf-8"),
                      ContentType="text/plain; charset=utf-8",
                      Metadata={
                          "source-bucket": bucket,
                          "source-key": urllib.parse.quote(key),
                          "model-id": MODEL_ID,
                          "input-tokens": str(usage["inputTokens"]),
                          "output-tokens": str(usage["outputTokens"]),
                          "truncated": str(truncated).lower(),
                      },
                  )
                  print(f"Summarized s3://{bucket}/{key} -> s3://{OUTPUT_BUCKET}/{output_key} "
                        f"({usage['inputTokens']} in / {usage['outputTokens']} out tokens, truncated={truncated})")
                  results.append({"source": key, "summary": output_key})
              return {"summaries": results}

Outputs:
  InputBucketName:
    Description: Upload .txt legal documents here.
    Value: !Ref InputBucket
  OutputBucketName:
    Description: Summaries are written to summaries/ in this bucket.
    Value: !Ref OutputBucket
  SummarizeFunctionName:
    Value: !Ref SummarizeFunction
  SummarizeFunctionRoleArn:
    Value: !GetAtt SummarizeFunctionRole.Arn
